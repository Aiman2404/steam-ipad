<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DeckOS" />
  <meta name="theme-color" content="#06070b" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <title>DeckOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/deck.css" />
</head>
<body>
  <!-- Living backdrop: blurred cover art + aurora tinted from the cover palette -->
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-art" id="artLayerA"></div>
    <div class="backdrop-art" id="artLayerB"></div>
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <div id="ambient" class="ambient" hidden>
    <div id="ambientTime" class="ambient-time mono">--:--</div>
    <div id="ambientDate" class="ambient-date"></div>
    <div class="ambient-hint">Tap anywhere</div>
  </div>

  <div id="dimmer" class="dimmer" aria-hidden="true"></div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-dot"></span><span id="toastText"></span>
  </div>

  <main id="deck" class="deck">
    <div class="deck-top">
      <!-- ZONE 1: media deck -->
      <section class="zone glass media" aria-label="Now playing">
        <header class="media-bar">
          <div class="brand">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-9.95 9.03l5.33 2.2a2.82 2.82 0 0 1 2.57-.47l2.43-3.52a3.77 3.77 0 1 1 3.77 3.77h-.09l-3.46 2.47c0 .19-.02.38-.07.57a2.83 2.83 0 0 1-5.46-.35L3.3 14.18A10 10 0 1 0 12 2zm4.15 7.24a2.51 2.51 0 1 0 0 5.02 2.51 2.51 0 0 0 0-5.02zm-6.4 6.53a1.88 1.88 0 1 0 0 3.76 1.88 1.88 0 0 0 0-3.76z"/></svg>
            <span>DECK<b>OS</b></span>
          </div>
          <button id="sourceChip" class="chip" type="button">
            <span class="chip-dot"></span><span id="sourceChipText">Connect Spotify</span>
          </button>
          <nav class="tabs" role="tablist">
            <button class="tab is-active" data-tab="lyrics" role="tab">Lyrics</button>
            <button class="tab" data-tab="library" role="tab">Library</button>
            <button class="tab" data-tab="queue" role="tab">Up next</button>
            <span class="tab-ink" aria-hidden="true"></span>
          </nav>
          <div class="bar-right">
            <span id="clock" class="clock mono">--:--</span>
            <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </div>
        </header>

        <div class="media-body">
          <!-- Now playing column -->
          <div class="np">
            <div class="cover-wrap">
              <div class="cover-glow" aria-hidden="true"></div>
              <div class="cover" id="cover">
                <img id="coverImgA" alt="" />
                <img id="coverImgB" alt="" />
                <div class="cover-empty" id="coverEmpty">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                </div>
              </div>
            </div>

            <div class="np-meta">
              <h1 id="npTitle" class="np-title">Nothing playing</h1>
              <p id="npArtist" class="np-artist">Connect Spotify or add songs to start</p>
            </div>

            <div class="scrub" id="scrub">
              <div class="scrub-track">
                <div class="scrub-fill" id="scrubFill"></div>
                <div class="scrub-knob" id="scrubKnob"></div>
              </div>
              <div class="scrub-times mono">
                <span id="timeNow">0:00</span>
                <span id="timeTotal">0:00</span>
              </div>
            </div>

            <div class="transport">
              <button class="t-btn" id="shuffleBtn" type="button" aria-label="Shuffle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
              </button>
              <button class="t-btn t-skip" id="prevBtn" type="button" aria-label="Previous">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2.2v12H6zm3.6 6 8.4 6V6z"/></svg>
              </button>
              <button class="t-play" id="playBtn" type="button" aria-label="Play">
                <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
                <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.3"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.3"/></svg>
              </button>
              <button class="t-btn t-skip" id="nextBtn" type="button" aria-label="Next">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.4-6L6 6zm9.8-12H18v12h-2.2z"/></svg>
              </button>
              <button class="t-btn" id="repeatBtn" type="button" aria-label="Repeat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                <span class="repeat-one">1</span>
              </button>
            </div>
          </div>

          <!-- Right panel: Lyrics / Library / Up next -->
          <div class="panel">
            <section class="pane is-active" data-pane="lyrics">
              <div class="lyrics" id="lyrics">
                <div class="lyrics-track" id="lyricsTrack"></div>
              </div>
              <div class="lyrics-tools">
                <div class="tools-left">
                  <button id="focusBtn" class="icon-btn icon-btn-sm" type="button" aria-label="Focus lyrics" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                  </button>
                  <span id="lyricsBadge" class="lyrics-badge"></span>
                </div>
                <div class="mini-transport">
                  <button class="t-btn" data-mini="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2.2v12H6zm3.6 6 8.4 6V6z"/></svg></button>
                  <button class="t-btn mini-play" data-mini="play" type="button" aria-label="Play or pause">
                    <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
                    <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.3"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.3"/></svg>
                  </button>
                  <button class="t-btn" data-mini="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.4-6L6 6zm9.8-12H18v12h-2.2z"/></svg></button>
                </div>
                <div class="nudge" title="Shift lyric timing if a song feels early or late">
                  <button type="button" data-nudge="-250" aria-label="Lyrics earlier">−</button>
                  <span id="nudgeValue" class="mono">0.00s</span>
                  <button type="button" data-nudge="250" aria-label="Lyrics later">+</button>
                </div>
              </div>
            </section>

            <section class="pane" data-pane="library">
              <div class="lib-switch">
                <button class="seg is-active" data-lib="spotify" type="button">Spotify</button>
                <button class="seg" data-lib="local" type="button">On this device</button>
              </div>
              <div class="lib-view" id="libSpotify"></div>
              <div class="lib-view" id="libLocal" hidden></div>
            </section>

            <section class="pane" data-pane="queue">
              <div class="queue" id="queue"></div>
            </section>
          </div>
        </div>
      </section>

      <!-- ZONE 2: sliders -->
      <aside class="sliders">
        <div class="zone glass slider" id="volumeSlider" data-kind="volume" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100">
          <div class="slider-fill"></div>
          <div class="slider-head">
            <span class="slider-label">Sound</span>
            <span class="slider-value mono">--</span>
            <span class="slider-sub"></span>
          </div>
          <div class="slider-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </div>
        </div>
        <div class="zone glass slider" id="brightSlider" data-kind="bright" role="slider" aria-label="Brightness" aria-valuemin="15" aria-valuemax="100">
          <div class="slider-fill"></div>
          <div class="slider-head">
            <span class="slider-label">Display</span>
            <span class="slider-value mono">--</span>
            <span class="slider-sub"></span>
          </div>
          <div class="slider-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
          </div>
        </div>
      </aside>
    </div>

    <!-- ZONE 3: five hardware dock buttons -->
    <nav class="dock" id="dock" aria-label="Dock"></nav>
  </main>

  <!-- Settings sheet -->
  <div class="sheet-backdrop" id="settingsSheet" hidden>
    <div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="sheet-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" data-close type="button" aria-label="Close">✕</button>
      </header>
      <div class="sheet-body" id="settingsBody"></div>
    </div>
  </div>

  <!-- Dock button editor -->
  <div class="sheet-backdrop" id="dockSheet" hidden>
    <div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="dockTitle">
      <header class="sheet-head">
        <h2 id="dockTitle">Dock buttons</h2>
        <button class="icon-btn" data-close type="button" aria-label="Close">✕</button>
      </header>
      <div class="sheet-body" id="dockBody"></div>
    </div>
  </div>

  <!-- Spotify device picker -->
  <div class="sheet-backdrop" id="deviceSheet" hidden>
    <div class="sheet sheet-sm glass" role="dialog" aria-modal="true" aria-labelledby="deviceTitle">
      <header class="sheet-head">
        <h2 id="deviceTitle">Play on…</h2>
        <button class="icon-btn" data-close type="button" aria-label="Close">✕</button>
      </header>
      <div class="sheet-body" id="deviceBody"></div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" multiple hidden />

  <script type="module" src="js/main.js"></script>
</body>
</html>
