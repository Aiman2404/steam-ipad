name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every module
        run: npm run check
      - name: Unit tests
        run: npm test

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check the PowerShell scripts
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            $errs | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)"; $bad++ }
          }
          if ($bad) { exit 1 } else { Write-Host 'PowerShell scripts OK' }
      - name: Compile the screen helper
        shell: powershell
        run: |
          # With no input the helper compiles, reports ready and exits; a C# error fails here.
          $out = '' | powershell -NoProfile -ExecutionPolicy Bypass -File link\lib\helper.ps1 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'ready') { Write-Host $out; exit 1 }
          Write-Host 'Screen helper compiles'
