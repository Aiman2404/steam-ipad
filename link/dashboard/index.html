<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06070b" />
  <title>DeckOS Link</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>

  <!-- Sign in / first-run setup -->
  <main id="gate" class="gate" hidden>
    <form id="gateForm" class="card gate-card" autocomplete="on">
      <div class="logo">
        <img src="/icons/icon.svg" alt="" />
        <div>
          <h1>DeckOS <b>Link</b></h1>
          <p id="gateSub">Sign in to your deck</p>
        </div>
      </div>
      <label class="field" id="displayField" hidden>
        <span>Your name</span>
        <input name="displayName" autocomplete="name" placeholder="Alex" />
      </label>
      <label class="field">
        <span>Username</span>
        <input name="username" autocomplete="username" autocapitalize="off" autocorrect="off" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required minlength="8" />
      </label>
      <p class="form-error" id="gateError" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit" id="gateBtn">Sign in</button>
      <p class="fine" id="gateFine"></p>
    </form>
  </main>

  <!-- Dashboard -->
  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="logo logo-sm">
        <img src="/icons/icon.svg" alt="" />
        <h1>DeckOS <b>Link</b></h1>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="me">
        <div class="avatar" id="meAvatar"></div>
        <div class="me-text">
          <strong id="meName"></strong>
          <span id="meRole" class="role"></span>
        </div>
      </div>
    </aside>
    <section class="main">
      <header class="main-head">
        <h2 id="pageTitle"></h2>
        <a class="btn btn-ghost" href="/" target="_blank" rel="noopener">Open the deck ↗</a>
      </header>
      <div id="page" class="page"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
