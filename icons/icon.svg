      <stop offset="1" stop-color="#8b95dc"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="80%">
      <stop offset="0" stop-color="#3a3f51"/>
      <stop offset="1" stop-color="#232733"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <path d="M138 132H250a124 124 0 0 1 0 248H138Z" fill="none" stroke="url(#ink)" stroke-width="34" stroke-linejoin="round"/>
